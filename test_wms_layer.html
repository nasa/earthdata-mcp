<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@nasa-terra/components@0.0.205/cdn/themes/horizon.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@nasa-terra/components@0.0.205/cdn/terra-ui-components-autoloader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ol@10/dist/ol.js"></script>
  <style>
    html, body { margin: 0; background: #1c1f26; font: 12px monospace; color: #cdd; }
    #status { padding: 6px 10px; background: rgba(0,0,0,0.7); color: #aef; }
    #status.error { color: #f88; }
    terra-map { display: block; width: 100%; height: 460px; }
  </style>
</head>
<body>
  <div id="status">Loading…</div>
  <terra-map id="map" collection-id="C1374742240-LAADS" show-layer-picker show-mouse-coordinates></terra-map>

  <script type="module">
  // MODIS_Terra_CorrectedReflectance_TrueColor — reliable GIBS layer for rendering test.
  // Uses fetch() → blob URL so ctx.drawImage() never taints the canvas.
  (async () => {
    const st = document.getElementById('status');
    const ok  = msg => { st.textContent = 'OK — ' + msg; st.className = ''; };
    const err = msg => { st.textContent = 'ERR — ' + msg; st.className = 'error'; };
    window.addEventListener('error', e => err('JS: ' + e.message));
    window.addEventListener('unhandledrejection', e => err('Promise: ' + e.reason));

    if (!window.ol) { err('OL not loaded'); return; }
    await customElements.whenDefined('terra-map');
    const el = document.getElementById('map');
    await el.updateComplete;
    if (typeof el.addLayer !== 'function') { err('terra-map has no addLayer'); return; }

    const extent4326 = [-180, -85, 180, 85];
    const extent3857 = ol.proj.transformExtent(extent4326, 'EPSG:4326', 'EPSG:3857');

    const params = new URLSearchParams({
      SERVICE: 'WMS', VERSION: '1.3.0', REQUEST: 'GetMap',
      CRS: 'EPSG:3857',
      BBOX: extent3857.join(','),
      WIDTH: 1024, HEIGHT: 1024,
      LAYERS: 'MODIS_Terra_CorrectedReflectance_TrueColor',
      FORMAT: 'image/jpeg',
      TRANSPARENT: 'FALSE',
    });

    st.textContent = 'Fetching WMS…';
    const wmsUrl = 'https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi?' + params.toString();
    const blob = await fetch(wmsUrl).then(r => {
      if (!r.ok) throw new Error('WMS HTTP ' + r.status);
      return r.blob();
    });
    const burl = URL.createObjectURL(blob);
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
      img.src = burl;
    });

    el.addLayer(
      new ol.layer.Image({
        extent: extent3857,
        opacity: 0.9,
        source: new ol.source.ImageCanvas({
          canvasFunction: (_ext, _res, pixelRatio, size) => {
            const c = document.createElement('canvas');
            c.width  = Math.round(size[0] * pixelRatio);
            c.height = Math.round(size[1] * pixelRatio);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            return c;
          },
          projection: 'EPSG:3857',
        }),
      }),
      { name: 'truecolor', position: 'top' }
    );

    ok('wms_layer — MODIS_Terra_CorrectedReflectance_TrueColor via GIBS');
  })();
  </script>
</body>
</html>
