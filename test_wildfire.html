<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@nasa-terra/components@0.0.205/cdn/themes/horizon.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@nasa-terra/components@0.0.205/cdn/terra-ui-components-autoloader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ol@10/dist/ol.js"></script>
  <style>
    html, body { margin: 0; background: #1c1f26; font: 12px monospace; color: #cdd; }
    #status { padding: 6px 10px; background: rgba(0,0,0,0.7); color: #aef; }
    #status.error { color: #f88; }
    terra-map { display: block; width: 100%; height: 460px; }
  </style>
</head>
<body>
  <div id="status">Loading...</div>
  <terra-map id="map" collection-id="C1374742240-LAADS" show-layer-picker show-mouse-coordinates></terra-map>

  <script type="module">
  (async () => {
    const st = document.getElementById('status');
    const ok  = msg => { st.textContent = 'OK — ' + msg; st.className = ''; };
    const err = msg => { st.textContent = 'ERR — ' + msg; st.className = 'error'; };

    window.addEventListener('error', e => err('JS: ' + e.message));
    window.addEventListener('unhandledrejection', e => err('Promise: ' + e.reason));

    if (!window.ol) { err('OL not loaded'); return; }

    await customElements.whenDefined('terra-map');
    const el = document.getElementById('map');
    await el.updateComplete;

    if (typeof el.addLayer !== 'function') { err('terra-map has no addLayer'); return; }

    // Fetch live wildfire events from EONET and render as vector points
    const resp = await fetch('https://eonet.gsfc.nasa.gov/api/v3/events?category=wildfires&status=open&limit=100');
    if (!resp.ok) { err('EONET fetch failed: ' + resp.status); return; }
    const data = await resp.json();

    const features = data.events.flatMap(event =>
      event.geometry.map(geom => {
        const f = new ol.Feature({
          geometry: new ol.geom.Point(ol.proj.fromLonLat(geom.coordinates)),
          title: event.title,
          magnitude: geom.magnitudeValue,
          unit: geom.magnitudeUnit,
        });
        return f;
      })
    );

    const vectorLayer = new ol.layer.Vector({
      source: new ol.source.Vector({ features }),
      style: new ol.style.Style({
        image: new ol.style.Circle({
          radius: 6,
          fill: new ol.style.Fill({ color: 'rgba(255, 80, 0, 0.85)' }),
          stroke: new ol.style.Stroke({ color: '#fff', width: 1.5 }),
        }),
      }),
    });

    el.addLayer(vectorLayer, { name: 'wildfire-events' });
    ok(`Vector layer added — ${features.length} active wildfire points from EONET`);
  })();
  </script>
</body>
</html>
