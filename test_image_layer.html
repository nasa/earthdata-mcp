<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@nasa-terra/components@0.0.205/cdn/themes/horizon.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@nasa-terra/components@0.0.205/cdn/terra-ui-components-autoloader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ol@10/dist/ol.js"></script>
  <style>
    html, body { margin: 0; background: #1c1f26; font: 12px monospace; color: #cdd; }
    #status { padding: 6px 10px; background: rgba(0,0,0,0.7); color: #aef; }
    #status.error { color: #f88; }
    terra-map { display: block; width: 100%; height: 460px; }
  </style>
</head>
<body>
  <div id="status">Loading…</div>
  <terra-map id="map" collection-id="C1374742240-LAADS" show-layer-picker show-mouse-coordinates></terra-map>

  <script type="module">
  (async () => {
    const st = document.getElementById('status');
    const ok  = msg => { st.textContent = 'OK — ' + msg; st.className = ''; };
    const err = msg => { st.textContent = 'ERR — ' + msg; st.className = 'error'; };
    window.addEventListener('error', e => err('JS: ' + e.message));
    window.addEventListener('unhandledrejection', e => err('Promise: ' + e.reason));

    if (!window.ol) { err('OL not loaded'); return; }
    await customElements.whenDefined('terra-map');
    const el = document.getElementById('map');
    await el.updateComplete;
    if (typeof el.addLayer !== 'function') { err('terra-map has no addLayer'); return; }

    const extent = [-10, 35, 40, 70];
    const e = ol.proj.transformExtent(extent, 'EPSG:4326', 'EPSG:3857');

    // Tiny solid black PNG as a data URI — same as what show_layer_map tool generates.
    // Uses fetch() → blob URL so drawing it to a canvas does NOT taint that canvas.
    const dataUri = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
    const blob = await fetch(dataUri).then(r => r.blob());
    const burl = URL.createObjectURL(blob);
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
      img.src = burl;
    });

    el.addLayer(
      new ol.layer.Image({
        extent: e,
        opacity: 0.7,
        source: new ol.source.ImageCanvas({
          canvasFunction(extent2, _res, pixelRatio, size) {
            const c = document.createElement('canvas');
            c.width  = Math.round(size[0] * pixelRatio);
            c.height = Math.round(size[1] * pixelRatio);
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0, c.width, c.height);
            return c;
          },
          projection: 'EPSG:3857',
        }),
      }),
      { name: 'black-box', position: 'top' }
    );
    ok('image_layer (data URI → fetch → blob URL) — black box over Europe [-10,35,40,70]');
  })();
  </script>
</body>
</html>
